name: build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install CMake
        uses: lukka/get-cmake@latest
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Build
        run: cmake --build build --config Release
      - name: Stage windows package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          New-Item -ItemType Directory -Force -Path dist/atanua-windows | Out-Null
          Copy-Item build/Release/atanua.exe dist/atanua-windows/
          $deps = dumpbin /dependents build/Release/atanua.exe
          foreach ($dll in @("SDL2.dll", "tinyxml2.dll")) {
            if ($deps -match [regex]::Escape($dll)) {
              $src = Join-Path build/Release $dll
              if (!(Test-Path $src)) { throw "$dll is linked but missing next to the exe" }
              Copy-Item $src dist/atanua-windows/
            }
          }
          if (!(Test-Path data)) { throw "data/ missing from checkout" }
          Copy-Item -Recurse data dist/atanua-windows/
          Copy-Item README.md,CHANGELOG.md dist/atanua-windows/
          if (Test-Path atanua.ico) { Copy-Item atanua.ico dist/atanua-windows/ }
      - name: Zip windows package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path dist/atanua-windows -DestinationPath artifacts/atanua-windows-x64.zip
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: atanua-windows
          path: artifacts/atanua-windows-x64.zip

  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          # libtinyxml2-dev is shared-only on Ubuntu; CMake FetchContent builds
          # a static libtinyxml2 when no .a is present. Keep the package so a
          # future distro .a is preferred automatically.
          sudo apt-get install -y build-essential cmake ninja-build libsdl2-dev libtinyxml2-dev libgl1-mesa-dev libglu1-mesa-dev libgtk-3-dev pkg-config curl
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_FIND_PACKAGE_PREFER_CONFIG=OFF
      - name: Build
        run: cmake --build build
      - name: Check Linux binary has no unresolved or tinyxml2 shared deps
        run: |
          ldd build/atanua | tee /tmp/atanua-ldd.txt
          if grep -E 'not found' /tmp/atanua-ldd.txt; then
            echo "build/atanua has unresolved shared libraries" >&2
            exit 1
          fi
          if grep -E 'libtinyxml2\.so' /tmp/atanua-ldd.txt; then
            echo "build/atanua still dynamically links tinyxml2; prefer static .a" >&2
            exit 1
          fi
      - name: Stage linux package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          [ -d data ] || { echo "data/ missing from checkout"; exit 1; }
          mkdir -p dist/atanua-linux artifacts
          cp build/atanua dist/atanua-linux/
          cp README.md CHANGELOG.md dist/atanua-linux/
          cp -r data dist/atanua-linux/
          [ -f atanua.desktop ] && cp atanua.desktop dist/atanua-linux/
          tar -czf artifacts/atanua-linux-x86_64.tar.gz -C dist atanua-linux
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: atanua-linux
          path: artifacts/atanua-linux-x86_64.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, ubuntu]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check version matches tag
        run: |
          TAG="${{ github.ref_name }}"
          test "${TAG#v}" = "$(grep -E '^#define ATANUAVERSION ' src/include/atanua_internal.h | cut -d'"' -f2)" \
            || { echo "ATANUAVERSION does not match tag $TAG"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: atanua-windows
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: atanua-linux
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          NOTES="$(awk -v want="## [$TAG]" 'index($0, want)==1 {flag=1; next} /^## / {flag=0} flag' CHANGELOG.md)"
          if [ -n "$NOTES" ]; then
            gh release create "$TAG" --title "$TAG" --notes "$NOTES" artifacts/atanua-windows-x64.zip artifacts/atanua-linux-x86_64.tar.gz
          else
            gh release create "$TAG" --title "$TAG" --generate-notes artifacts/atanua-windows-x64.zip artifacts/atanua-linux-x86_64.tar.gz
          fi
